<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dagens promenad</title>

<meta name="theme-color" content="#10120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

:root {
    --bg: #0d0f0c;
    --card: #181b16;
    --card-light: #22251f;
    --text: #f5f7f1;
    --muted: #969c90;
    --green: #caff00;
    --green-dark: #a9d900;
    --border: rgba(255,255,255,.08);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(202,255,0,.12),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    padding: 16px;
}

/* -------------------------
   TOPP
------------------------- */

.header {
    padding: 8px 6px 20px;
}

.name-day {
    color: var(--green);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.date {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1;
}

.weekday {
    margin-top: 7px;
    color: #d1d5ca;
    font-size: 17px;
    font-weight: 600;
}

/* -------------------------
   HERO
------------------------- */

.hero {
    position: relative;
    overflow: hidden;

    min-height: 250px;

    padding: 28px 25px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            #dcff1a 0%,
            #caff00 45%,
            #a8df00 100%
        );

    color: #11140c;

    box-shadow:
        0 20px 55px rgba(202,255,0,.15);

    margin-bottom: 17px;
}

.hero::after {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    right: -75px;
    bottom: -125px;

    border-radius: 50%;

    border: 1px solid rgba(0,0,0,.12);

    box-shadow:
        0 0 0 30px rgba(0,0,0,.025),
        0 0 0 60px rgba(0,0,0,.018),
        0 0 0 90px rgba(0,0,0,.012);
}

.hero-title {
    font-size: 37px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -1.5px;
}

.hero-subtitle {
    margin-top: 9px;

    font-size: 17px;
    font-weight: 650;

    opacity: .7;
}

/* -------------------------
   AVGÅNG
------------------------- */

.departure {
    position: absolute;

    right: 18px;
    top: 18px;

    min-width: 95px;

    padding: 11px 13px;

    text-align: center;

    border-radius: 19px;

    background: rgba(0,0,0,.13);

    backdrop-filter: blur(8px);
}

.departure-label {
    font-size: 11px;
    font-weight: 900;

    letter-spacing: 1px;

    opacity: .6;
}

.departure-time {
    margin-top: 3px;

    font-size: 26px;
    font-weight: 900;

    line-height: 1;
}

/* -------------------------
   INFO
------------------------- */

.duration {
    position: absolute;

    left: 25px;
    bottom: 25px;

    padding: 9px 13px;

    border-radius: 999px;

    background: rgba(255,255,255,.27);

    font-size: 13px;
    font-weight: 850;
}

/* -------------------------
   ANMÄLAN
------------------------- */

.signup-card {
    background:
        linear-gradient(
            180deg,
            #1a1c18,
            #151713
        );

    border: 1px solid var(--border);

    border-radius: 25px;

    padding: 14px;

    box-shadow:
        0 18px 50px rgba(0,0,0,.35);

    margin-bottom: 16px;
}

.signup {
    display: flex;
    gap: 10px;
}

.name-input {
    flex: 1;

    min-width: 0;

    border: 1px solid rgba(255,255,255,.08);

    outline: none;

    background: #252820;

    color: white;

    border-radius: 17px;

    padding: 16px;

    font-size: 16px;

    font-weight: 600;
}

.name-input::placeholder {
    color: #777d72;
}

.name-input:focus {
    border-color: rgba(202,255,0,.55);

    box-shadow:
        0 0 0 3px rgba(202,255,0,.08);
}

.join-button {
    border: none;

    cursor: pointer;

    min-width: 108px;

    border-radius: 17px;

    padding: 0 18px;

    background:
        linear-gradient(
            135deg,
            #f1ff88,
            #caff00
        );

    color: #10130c;

    font-size: 16px;
    font-weight: 900;

    box-shadow:
        0 8px 22px rgba(202,255,0,.14);

    transition: transform .15s ease;
}

.join-button:active {
    transform: scale(.96);
}

/* -------------------------
   LISTA
------------------------- */

.list-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 20px 18px 12px;
}

.list-title {
    font-size: 19px;
    font-weight: 900;
}

.count {
    background: #252820;

    color: #bfc4b9;

    border-radius: 999px;

    padding: 7px 11px;

    font-size: 12px;

    font-weight: 900;
}

.people {
    padding: 0 14px 14px;
}

.person {
    display: flex;

    align-items: center;

    gap: 13px;

    padding: 13px 7px;

    border-top: 1px solid var(--border);

    animation: appear .25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.avatar {
    width: 47px;
    height: 47px;

    flex-shrink: 0;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: #2a2d26;

    color: white;

    font-size: 16px;
    font-weight: 900;
}

.person-info {
    flex: 1;

    min-width: 0;
}

.person-name {
    font-size: 16px;
    font-weight: 850;
}

.person-time {
    margin-top: 3px;

    color: #858b80;

    font-size: 12px;
}

.remove {
    border: none;

    background: transparent;

    color: #777d73;

    width: 36px;
    height: 36px;

    border-radius: 12px;

    font-size: 21px;

    cursor: pointer;
}

.remove:active {
    background: #292c25;
}

.empty {
    padding: 28px 15px 30px;

    text-align: center;

    color: #777c72;

    font-size: 14px;

    line-height: 1.6;
}

/* -------------------------
   INFORMATIONSKORT
------------------------- */

.info {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 16px;
}

.info-card {
    background: #171914;

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 15px;
}

.info-label {
    color: #777d73;

    font-size: 11px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.info-value {
    margin-top: 5px;

    font-size: 17px;

    font-weight: 900;
}

/* -------------------------
   STATUS
------------------------- */

.status {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 16px;

    padding: 12px 14px;

    border-radius: 16px;

    background: #151713;

    border: 1px solid var(--border);

    color: #8e9489;

    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px rgba(202,255,0,.7);
}

/* -------------------------
   FOOTER
------------------------- */

.footer {
    padding: 22px 0 10px;

    text-align: center;

    color: #555b51;

    font-size: 11px;
}

/* -------------------------
   MOBIL
------------------------- */

@media(max-width:390px) {

    .app {
        padding: 12px;
    }

    .date {
        font-size: 35px;
    }

    .hero-title {
        font-size: 32px;
    }

    .signup {
        flex-direction: column;
    }

    .join-button {
        height: 52px;
    }

}

</style>
</head>

/* =========================================================
   DATUM
========================================================= */

const today = new Date();

const months = [
    "januari",
    "februari",
    "mars",
    "april",
    "maj",
    "juni",
    "juli",
    "augusti",
    "september",
    "oktober",
    "november",
    "december"
];

const weekdays = [
    "söndag",
    "måndag",
    "tisdag",
    "onsdag",
    "torsdag",
    "fredag",
    "lördag"
];

const month =
    String(today.getMonth() + 1).padStart(2,"0");

const day =
    String(today.getDate()).padStart(2,"0");

const year =
    today.getFullYear();

const dateKey =
    `${year}-${month}-${day}`;


/* Visa datum */

document.getElementById("date").textContent =
    `${day} ${months[today.getMonth()]}`;

document.getElementById("weekday").textContent =
    weekdays[today.getDay()];

document.getElementById("nameDay").textContent =
    "DAGENS NAMN: " +
    (nameDays[`${month}-${day}`] || "–");


/* =========================================================
   DAGENS LISTA
========================================================= */

const storageKey =
    "lunchturen-" + dateKey;


function getPeople() {

    try {

        return JSON.parse(
            localStorage.getItem(storageKey) || "[]"
        );

    } catch {

        return [];

    }

}


function savePeople(people) {

    localStorage.setItem(
        storageKey,
        JSON.stringify(people)
    );

}


/* =========================================================
   SÄKER TEXT
========================================================= */

function safeText(text) {

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   INITIALER
========================================================= */

function getInitials(name) {

    return name
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(word =>
            word.charAt(0).toUpperCase()
        )
        .join("");

}


/* =========================================================
   VISA LISTAN
========================================================= */

function renderPeople() {

    const people = getPeople();

    const container =
        document.getElementById("people");

    const count =
        document.getElementById("count");


    count.textContent =
        people.length +
        (people.length === 1
            ? " PERSON"
            : " PERSONER");


    if (people.length === 0) {

        container.innerHTML = `
            <div class="empty">

                Ingen har anmält sig ännu.<br>

                Bli först att hänga med! 👟

            </div>
        `;

        return;

    }


    container.innerHTML =
        people.map((person,index) => `

            <div class="person">

                <div class="avatar">
                    ${safeText(
                        getInitials(person.name)
                    )}
                </div>

                <div class="person-info">

                    <div class="person-name">
                        ${safeText(person.name)}
                    </div>

                    <div class="person-time">
                        Anmäld ${safeText(person.time)}
                    </div>

                </div>

                <button
                    class="remove"
                    onclick="removePerson(${index})"
                    aria-label="Ta bort"
                    title="Ta bort">

                    ×

                </button>

            </div>

        `).join("");

}


/* =========================================================
   ANMÄL PERSON
========================================================= */

function joinWalk() {

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();


    if (!name) {

        input.focus();

        return;

    }


    const people =
        getPeople();


    /* Kontrollera dubbla namn */

    const exists =
        people.some(person =>
            person.name.toLowerCase()
            === name.toLowerCase()
        );


    if (exists) {

        input.value = "";

        input.placeholder =
            "Du är redan anmäld";

        setTimeout(() => {

            input.placeholder =
                "Skriv ditt namn…";

        },1800);

        return;

    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "sv-SE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    people.push({

        name: name,

        time: time,

        createdAt: Date.now()

    });


    savePeople(people);


    input.value = "";


    renderPeople();

}


/* =========================================================
   TA BORT PERSON
========================================================= */

function removePerson(index) {

    const people =
        getPeople();


    people.splice(index,1);


    savePeople(people);


    renderPeople();

}


/* =========================================================
   KNAPP
========================================================= */

document
    .getElementById("joinButton")
    .addEventListener(
        "click",
        joinWalk
    );


/* Enter fungerar också */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                joinWalk();

            }

        }
    );


/* =========================================================
   STARTA
========================================================= */

renderPeople();


/* =========================================================
   MIDNATTSKONTROLL

   Om sidan ligger öppen när dagen ändras laddas den om
   så att gårdagens deltagare inte visas.
========================================================= */

setInterval(() => {

    const current =
        new Date();

    const currentKey =
        current.getFullYear() +
        "-" +
        String(
            current.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            current.getDate()
        ).padStart(2,"0");


    if (currentKey !== dateKey) {

        location.reload();

    }

},60000);
