<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Dagens promenad</title>

<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
    --bg: #090b0a;
    --card: #171a18;
    --card2: #202420;
    --text: #f5f7f5;
    --muted: #969d98;
    --green: #caff00;
    --green-dark: #a9d900;
    --line: rgba(255,255,255,.08);
    --danger: #ff5c5c;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, rgba(202,255,0,.13), transparent 38%),
        var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: env(safe-area-inset-top) 18px 40px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 28px 5px 20px;
}

.small-label {
    color: var(--green);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.date {
    font-size: 39px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -1.5px;
}

.weekday {
    margin-top: 9px;
    color: var(--muted);
    font-size: 17px;
    font-weight: 600;
}

/* DEPARTURE */

.departure {
    background:
        linear-gradient(
            135deg,
            #d4ff00 0%,
            #baf000 55%,
            #9bd900 100%
        );
    color: #111;
    border-radius: 30px;
    padding: 25px 25px 27px;
    box-shadow:
        0 18px 50px rgba(202,255,0,.12),
        inset 0 1px 0 rgba(255,255,255,.35);
    margin-top: 8px;
    position: relative;
    overflow: hidden;
}

.departure:after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    right: -75px;
    bottom: -80px;
}

.departure-title {
    font-size: 34px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -1px;
}

.departure-sub {
    font-size: 16px;
    margin-top: 5px;
    opacity: .72;
    font-weight: 600;
}

.time-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
}

.time {
    font-size: 58px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -3px;
}

.time-label {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: .55;
}

/* STATUS */

.status {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 17px 0 13px;
}

.status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
}

/* SIGNUP */

.signup {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 23px;
    padding: 13px;
    display: flex;
    gap: 9px;
    box-shadow: 0 12px 30px rgba(0,0,0,.22);
}

.signup input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 17px;
    padding: 13px 9px;
}

.signup input::placeholder {
    color: #747a76;
}

.signup button {
    border: none;
    border-radius: 17px;
    padding: 0 20px;
    background: var(--green);
    color: #111;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    transition: .15s;
}

.signup button:active {
    transform: scale(.96);
}

.signup button:disabled {
    opacity: .5;
}

/* PEOPLE */

.people-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 29px 3px 12px;
}

.people-title {
    font-size: 22px;
    font-weight: 850;
}

.count {
    background: var(--card2);
    color: var(--green);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
}

/* PERSON */

.people {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.person {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 15px;
    display: flex;
    align-items: center;
    gap: 13px;
    animation: appear .25s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #323832, #1b1e1b);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    font-weight: 900;
    font-size: 18px;
}

.person-info {
    flex: 1;
}

.person-name {
    font-size: 17px;
    font-weight: 800;
}

.person-time {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 35px 20px;
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--line);
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 9px;
}

/* INFO */

.info {
    margin-top: 20px;
    background: rgba(202,255,0,.055);
    border: 1px solid rgba(202,255,0,.12);
    border-radius: 18px;
    padding: 15px;
    color: #b9beb9;
    font-size: 13px;
    line-height: 1.45;
    text-align: center;
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: calc(25px + env(safe-area-inset-bottom));
    transform: translate(-50%, 100px);
    background: #f4f6f4;
    color: #111;
    padding: 13px 20px;
    border-radius: 18px;
    font-weight: 750;
    font-size: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    transition: .3s;
    z-index: 100;
    white-space: nowrap;
}

.toast.show {
    transform: translate(-50%, 0);
}

.toast.error {
    background: #ff6464;
    color: white;
}

/* LOADING */

.loading {
    opacity: .5;
}

/* DESKTOP */

@media (min-width: 600px) {
    body {
        padding-top: 25px;
    }

    .app {
        padding-bottom: 70px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="small-label" id="nameDay">
            DAGENS NAMN
        </div>

        <div class="date" id="date">
            --
        </div>

        <div class="weekday" id="weekday">
            --
        </div>
    </header>


    <section class="departure">

        <div class="departure-title">
            Lunchturen
        </div>

        <div class="departure-sub">
            Ca. 30 minuter frisk luft
        </div>

        <div class="time-box">
            <div class="time">
                11:15
            </div>

            <div class="time-label">
                AVGÅNG
            </div>
        </div>

    </section>


    <div class="status" id="status">
        <span class="status-dot"></span>
        Uppdateras automatiskt
    </div>


    <section class="signup">

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            autocomplete="name"
            placeholder="Skriv ditt namn..."
            enterkeyhint="done"
        >

        <button id="joinButton">
            Häng med
        </button>

    </section>


    <section>

        <div class="people-header">
            <div class="people-title">
                Anmälda
            </div>

            <div class="count" id="count">
                0 PERSONER
            </div>
        </div>

        <div class="people" id="people">

            <div class="empty">
                <div class="empty-icon">🚶</div>
                Ingen har anmält sig ännu.
                <br>
                Bli först!
            </div>

        </div>

    </section>


    <div class="info">
        🚶 Alla som öppnar sidan ser samma lista.
        <br>
        Listan gäller endast dagens promenad.
    </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://hhbhilkcljzmzmjypqgm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UzO8tyWP0jt-3HGnLftNLg_U3tLVH9F";


/* =========================================================
   HJÄLPMETODER
   ========================================================= */

const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
};


function stockholmDate() {

    const parts = new Intl.DateTimeFormat(
        "sv-SE",
        {
            timeZone: "Europe/Stockholm",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).formatToParts(new Date());

    const year =
        parts.find(x => x.type === "year").value;

    const month =
        parts.find(x => x.type === "month").value;

    const day =
        parts.find(x => x.type === "day").value;

    return `${year}-${month}-${day}`;
}


const today = stockholmDate();


/* =========================================================
   DATUM
   ========================================================= */

function showDate() {

    const date = new Date(
        today + "T12:00:00"
    );

    const dateText = new Intl.DateTimeFormat(
        "sv-SE",
        {
            timeZone: "Europe/Stockholm",
            day: "numeric",
            month: "long"
        }
    ).format(date);

    const weekday = new Intl.DateTimeFormat(
        "sv-SE",
        {
            timeZone: "Europe/Stockholm",
            weekday: "long"
        }
    ).format(date);

    document.getElementById("date").textContent =
        dateText;

    document.getElementById("weekday").textContent =
        weekday.charAt(0).toUpperCase() +
        weekday.slice(1);
}


/* =========================================================
   NAMNSDAG
   ========================================================= */

async function loadNameDay() {

    const el =
        document.getElementById("nameDay");

    try {

        const date = new Date(
            today + "T12:00:00"
        );

        const day = date.getDate();
        const month = date.getMonth() + 1;

        const response = await fetch(
            `https://api.abalin.net/get/namedays?country=se&day=${day}&month=${month}`
        );

        if (!response.ok)
            throw new Error();

        const data = await response.json();

        const names =
            data?.data?.namedays?.se;

        if (names) {

            const text = Array.isArray(names)
                ? names.join(", ")
                : names;

            el.textContent =
                "DAGENS NAMN: " +
                text.toUpperCase();

        } else {

            el.textContent =
                "DAGENS PROMENAD";

        }

    } catch (error) {

        /*
         * Reserv för 25 augusti.
         * Om namnsdags-API:t inte svarar visas
         * ändå dagens namn korrekt för appens startdag.
         */

        if (today === "2026-08-25") {

            el.textContent =
                "DAGENS NAMN: LOVISA, LOUISE";

        } else {

            el.textContent =
                "DAGENS PROMENAD";

        }
    }
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(message, error = false) {

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.toggle("error", error);
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        el.classList.remove("show");
    }, 2600);
}


/* =========================================================
   HÄMTA ANMÄLDA
   ========================================================= */

async function loadSignups() {

    const people =
        document.getElementById("people");

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/walk_signups" +
            "?select=id,name,created_at" +
            "&date_key=eq." +
            encodeURIComponent(today) +
            "&order=created_at.asc";

        const response =
            await fetch(url, {
                headers
            });

        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(text);
        }

        const data =
            await response.json();

        renderPeople(data);

        document.getElementById("status").innerHTML =
            '<span class="status-dot"></span> Uppdaterad nyss';

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            '<span class="status-dot" style="background:#ff5c5c"></span> Kunde inte uppdatera';

    }
}


/* =========================================================
   VISA ANMÄLDA
   ========================================================= */

function renderPeople(data) {

    const container =
        document.getElementById("people");

    const count =
        document.getElementById("count");

    count.textContent =
        data.length === 1
            ? "1 PERSON"
            : data.length + " PERSONER";


    if (!data.length) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🚶</div>
                Ingen har anmält sig ännu.
                <br>
                Bli först!
            </div>
        `;

        return;
    }


    container.innerHTML =
        data.map(person => {

            const firstLetter =
                person.name
                    .trim()
                    .charAt(0)
                    .toUpperCase();

            const time =
                new Intl.DateTimeFormat(
                    "sv-SE",
                    {
                        timeZone: "Europe/Stockholm",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                ).format(
                    new Date(person.created_at)
                );

            return `
                <div class="person">

                    <div class="avatar">
                        ${escapeHtml(firstLetter)}
                    </div>

                    <div class="person-info">

                        <div class="person-name">
                            ${escapeHtml(person.name)}
                        </div>

                        <div class="person-time">
                            Anmäld ${time}
                        </div>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   SKYDDA HTML
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   ANMÄL
   ========================================================= */

async function joinWalk() {

    const input =
        document.getElementById("nameInput");

    const button =
        document.getElementById("joinButton");

    const name =
        input.value.trim();


    if (!name) {

        toast(
            "Skriv ditt namn först",
            true
        );

        input.focus();

        return;
    }


    if (name.length > 30) {

        toast(
            "Namnet är för långt",
            true
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Anmäler...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/walk_signups",
                {
                    method: "POST",
                    headers: {
                        ...headers,
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        date_key: today,
                        name: name
                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(errorText);
        }


        input.value = "";

        toast(
            "Du är med på promenaden! 🚶"
        );

        await loadSignups();


    } catch (error) {

        console.error(error);

        toast(
            "Kunde inte anmäla dig",
            true
        );

    } finally {

        button.disabled = false;
        button.textContent = "Häng med";

    }
}


/* =========================================================
   START
   ========================================================= */

showDate();

loadNameDay();

loadSignups();


/*
 * Uppdatera listan var 5:e sekund.
 * Då ser alla nya anmälningar nästan direkt.
 */

setInterval(
    loadSignups,
    5000
);


/*
 * Enter i namnfältet
 */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                joinWalk();

            }

        }
    );


document
    .getElementById("joinButton")
    .addEventListener(
        "click",
        joinWalk
    );

</script>

</body>
</html>
