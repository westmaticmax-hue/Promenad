               maximum-scale=1,
               viewport-fit=cover">

<style>

:root {
    --bg: #090b0a;
    --card: #171a18;
    --card2: #202420;
    --text: #f5f7f1;
    --muted: #969d98;
    --green: #caff00;
    --green-dark: #a9d900;
    --border: rgba(255,255,255,.09);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
    padding:
        max(18px, env(safe-area-inset-top))
        14px
        max(28px, env(safe-area-inset-bottom));
}

.app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 3px 4px 18px;
}

.name-day {
    color: var(--green);
    font-size: 13px;
    font-weight: 850;
    letter-spacing: 1.7px;
    text-transform: uppercase;
    margin-bottom: 7px;
}

.date {
    font-size: 38px;
    line-height: 1;
    font-weight: 850;
    letter-spacing: -1.5px;
}

.weekday {
    color: var(--muted);
    font-size: 18px;
    font-weight: 650;
    margin-top: 8px;
}


/* =========================
   MAIN GREEN CARD
========================= */

.hero {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #d5ff00 0%,
            #caff00 55%,
            #a9df00 100%
        );

    color: #10120e;

    border-radius: 30px;

    padding: 23px 23px 21px;

    box-shadow:
        0 18px 45px rgba(180,240,0,.13);
}

.hero::after {
    content: "";
    position: absolute;

    width: 210px;
    height: 210px;

    right: -85px;
    bottom: -110px;

    border-radius: 50%;

    background: rgba(255,255,255,.11);
}

.hero-title {
    position: relative;
    z-index: 1;

    font-size: 34px;
    font-weight: 950;
    font-style: italic;

    letter-spacing: -1px;
}

.hero-sub {
    position: relative;
    z-index: 1;

    font-size: 16px;
    font-weight: 650;

    opacity: .72;

    margin-top: 3px;
}

.hero-row {
    position: relative;
    z-index: 1;

    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    margin-top: 20px;
}

.time {
    font-size: 61px;
    line-height: .88;

    font-weight: 950;

    letter-spacing: -3px;
}

.departure {
    text-align: right;

    font-size: 14px;
    line-height: 1.3;

    font-weight: 800;

    max-width: 190px;
}

.departure-label {
    display: block;

    font-size: 11px;

    letter-spacing: 1.2px;

    opacity: .55;

    margin-bottom: 4px;
}


/* =========================
   STATUS
========================= */

.status {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    margin: 14px 0;
}

.status-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    margin-right: 6px;
}


/* =========================
   SIGNUP
========================= */

.signup {
    display: flex;
    gap: 8px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 22px;

    padding: 10px;
}

.signup input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-size: 16px;

    padding: 10px;
}

.signup input::placeholder {
    color: #777e79;
}

.signup button {
    border: 0;

    background: var(--green);

    color: #111;

    border-radius: 16px;

    font-weight: 900;

    font-size: 16px;

    padding: 0 18px;

    cursor: pointer;

    min-height: 46px;
}

.signup button:active {
    transform: scale(.97);
}


/* =========================
   SECTION TITLE
========================= */

.section-head {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin:
        23px
        3px
        10px;
}

.section-title {
    font-size: 23px;

    font-weight: 900;
}

.count {
    background: var(--card2);

    color: var(--green);

    border-radius: 20px;

    padding: 7px 12px;

    font-size: 12px;

    font-weight: 850;
}


/* =========================
   PEOPLE
========================= */

.people {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.person {
    display: flex;

    align-items: center;

    gap: 12px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 19px;

    padding: 11px 13px;
}

.avatar {
    width: 43px;
    height: 43px;

    flex: 0 0 43px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: #292d29;

    color: var(--green);

    font-weight: 900;

    font-size: 18px;
}

.person-name {
    font-size: 18px;

    font-weight: 850;
}

.person-time {
    font-size: 13px;

    color: var(--muted);

    margin-top: 2px;
}

.empty {
    text-align: center;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 19px;

    padding: 24px;

    color: var(--muted);

    font-size: 14px;
}


/* =========================
   BUTTONS
========================= */

.action {
    width: 100%;

    min-height: 53px;

    margin-top: 15px;

    border: 0;

    border-radius: 17px;

    background: var(--green);

    color: #111;

    font-size: 17px;

    font-weight: 900;

    cursor: pointer;
}

.action:active {
    transform: scale(.98);
}

.action.secondary {
    background: var(--card2);

    color: var(--green);

    border: 1px solid rgba(202,255,0,.25);
}


/* =========================
   MAP
========================= */

.map-card {
    margin-top: 13px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 14px;
}

.map-title {
    font-size: 18px;

    font-weight: 850;

    margin-bottom: 10px;
}

.map-placeholder {
    height: 150px;

    border-radius: 13px;

    background: #101311;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: var(--muted);

    font-size: 13px;

    border: 1px solid rgba(255,255,255,.05);
}

.stats {
    display: flex;

    justify-content: space-around;

    text-align: center;

    margin-top: 12px;
}

.stat strong {
    display: block;

    font-size: 18px;
}

.stat span {
    color: var(--muted);

    font-size: 12px;
}


/* =========================
   MESSAGES
========================= */

.message {
    text-align: center;

    padding: 12px;

    font-size: 13px;

    color: var(--muted);
}

.message.error {
    color: #ff7b7b;
}

.hidden {
    display: none !important;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .date {
        font-size: 34px;
    }

    .hero-title {
        font-size: 31px;
    }

    .time {
        font-size: 55px;
    }

    .departure {
        font-size: 13px;
        max-width: 165px;
    }

    .signup button {
        padding: 0 14px;
    }
}

</style>
</head>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="name-day" id="nameDay">
            DAGENS NAMN
        </div>

        <div class="date" id="date">
            --
        </div>

        <div class="weekday" id="weekday">
            --
        </div>

    </div>


    <!-- HERO -->

    <div class="hero">

        <div class="hero-title">
            Lunchturen
        </div>

        <div class="hero-sub">
            Ca. 30 minuter frisk luft
        </div>

        <div class="hero-row">

            <div class="time">
                11:15
            </div>

            <div class="departure">

                <span class="departure-label">
                    AVGÅNG
                </span>

                📍 Söder Mälarstrand 77

            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div class="status">

        <span class="status-dot"></span>

        <span id="status">
            Ansluten till dagens promenad
        </span>

    </div>


    <!-- SIGNUP -->

    <form
        class="signup"
        id="signupForm"
    >

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            autocomplete="name"
            placeholder="Skriv ditt namn…"
            aria-label="Skriv ditt namn"
            required
        >

        <button type="submit">
            Häng med
        </button>

    </form>


    <div
        id="message"
        class="message hidden"
    ></div>


    <!-- PEOPLE -->

    <div class="section-head">

        <div class="section-title">
            Anmälda
        </div>

        <div
            class="count"
            id="count"
        >
            0 PERSONER
        </div>

    </div>


    <div
        class="people"
        id="people"
    >

        <div class="empty">
            🚶<br>
            Ingen har anmält sig ännu.<br>
            Bli först!
        </div>

    </div>


    <!-- START -->

    <button
        class="action"
        id="startButton"
        type="button"
    >
        🚶 STARTA PROMENAD
    </button>


    <!-- AFTER START -->

    <div
        id="afterStart"
        class="hidden"
    >

        <button
            class="action secondary"
            id="finishButton"
            type="button"
        >
            🏁 AVSLUTA PROMENAD
        </button>


        <!-- MAP -->

        <div class="map-card">

            <div class="map-title">
                🗺️ Dagens promenad
            </div>

            <div class="map-placeholder">

                GPS-kartan visas här<br>
                efter avslutad promenad

            </div>

            <div class="stats">

                <div class="stat">

                    <strong id="distance">
                        —
                    </strong>

                    <span>
                        Distans
                    </span>

                </div>


                <div class="stat">

                    <strong id="duration">
                        —
                    </strong>

                    <span>
                        Tid
                    </span>

                </div>


                <div class="stat">

                    <strong>
                        11:15
                    </strong>

                    <span>
                        Start
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

/* =========================================================
   DATUM
========================================================= */

function updateDate() {

    const now = new Date();

    const day =
        String(now.getDate()).padStart(2, "0");

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const key =
        month + "-" + day;


    const months = [
        "januari",
        "februari",
        "mars",
        "april",
        "maj",
        "juni",
        "juli",
        "augusti",
        "september",
        "oktober",
        "november",
        "december"
    ];


    const weekdays = [
        "Söndag",
        "Måndag",
        "Tisdag",
        "Onsdag",
        "Torsdag",
        "Fredag",
        "Lördag"
    ];


    dateElement.textContent =
        now.getDate() +
        " " +
        months[now.getMonth()];


    weekdayElement.textContent =
        weekdays[now.getDay()];


    const todayNames =
        nameDays[key] || "DAGENS NAMN";


    nameDayElement.textContent =
        "DAGENS NAMN: " +
        todayNames;
}


updateDate();


/* =========================================================
   HJÄLPFUNKTIONER
========================================================= */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showMessage(text, error = false) {

    messageElement.textContent = text;

    messageElement.classList.remove("hidden");

    messageElement.classList.toggle(
        "error",
        error
    );


    setTimeout(() => {

        messageElement.classList.add("hidden");

    }, 4000);
}


/* =========================================================
   VISA ANMÄLDA
========================================================= */

function renderPeople(signups) {

    countElement.textContent =
        signups.length +
        " " +
        (signups.length === 1
            ? "PERSON"
            : "PERSONER");


    if (!signups.length) {

        peopleElement.innerHTML = `
            <div class="empty">
                🚶<br>
                Ingen har anmält sig ännu.<br>
                Bli först!
            </div>
        `;

        return;
    }


    peopleElement.innerHTML =
        signups.map(person => {

            const name =
                escapeHtml(person.name);


            const initial =
                escapeHtml(
                    person.name
                        .trim()
                        .charAt(0)
                        .toUpperCase()
                );


            let timeText = "Anmäld";


            if (person.created_at) {

                const date =
                    new Date(person.created_at);


                timeText =
                    "Anmäld " +
                    date.toLocaleTimeString(
                        "sv-SE",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );
            }


            return `
                <div class="person">

                    <div class="avatar">
                        ${initial}
                    </div>

                    <div>

                        <div class="person-name">
                            ${name}
                        </div>

                        <div class="person-time">
                            ${timeText}
                        </div>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   HÄMTA ANMÄLDA
========================================================= */

async function loadSignups() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient

            .from("walk_signups")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(error);

            statusElement.textContent =
                "Kunde inte läsa anmälningarna";

            return;
        }


        renderPeople(data || []);


        statusElement.textContent =
            "Uppdaterad nyss";


    } catch (error) {

        console.error(error);

        statusElement.textContent =
            "Anslutningsfel";
    }
}


/* =========================================================
   ANMÄL DIG
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            nameInput.value.trim();


        if (!name) {

            showMessage(
                "Skriv ditt namn först.",
                true
            );

            return;
        }


        const button =
            form.querySelector("button");


        button.disabled = true;

        button.textContent =
            "Anmäler…";


        try {

            const {
                error
            } =
            await supabaseClient

                .from("walk_signups")

                .insert([
                    {
                        name: name
                    }
                ]);


            if (error) {

                console.error(error);

                showMessage(
                    "Kunde inte anmäla dig.",
                    true
                );

                return;
            }


            nameInput.value = "";


            showMessage(
                "Du är anmäld! 🚶"
            );


            await loadSignups();


        } catch (error) {

            console.error(error);

            showMessage(
                "Något gick fel.",
                true
            );


        } finally {

            button.disabled = false;

            button.textContent =
                "Häng med";
        }

    }
);


/* =========================================================
   REALTIME
========================================================= */

supabaseClient

    .channel("walk-signups")

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "walk_signups"
        },
        function() {

            loadSignups();

        }
    )

    .subscribe();


/* =========================================================
   STARTA PROMENAD
========================================================= */

let walkStarted = false;

let walkStartTime = null;


startButton.addEventListener(
    "click",
    function() {

        walkStarted = true;

        walkStartTime =
            new Date();


        startButton.textContent =
            "🟢 PROMENADEN PÅGÅR";


        startButton.disabled =
            true;


        afterStart.classList.remove(
            "hidden"
        );


        statusElement.textContent =
            "Promenaden pågår";


        /*
           GPS KOMMER IN HÄR.

           Nästa steg kan vi lägga in:

           navigator.geolocation.watchPosition()

           och spara GPS-punkterna i Supabase.
        */

    }
);


/* =========================================================
   AVSLUTA PROMENAD
========================================================= */

finishButton.addEventListener(
    "click",
    function() {

        if (!walkStarted) {
            return;
        }


        const finishTime =
            new Date();


        const milliseconds =
            finishTime -
            walkStartTime;


        const minutes =
            Math.max(
                1,
                Math.round(
                    milliseconds /
                    60000
                )
            );


        document.getElementById(
            "duration"
        ).textContent =
            minutes + " min";


        finishButton.textContent =
            "✓ PROMENADEN AVSLUTAD";


        finishButton.disabled =
            true;


        statusElement.textContent =
            "Promenaden är avslutad";


        /*
           Här kommer den riktiga
           GPS-kartan i nästa steg.
        */
    }
);


/* =========================================================
   START
========================================================= */

loadSignups();
